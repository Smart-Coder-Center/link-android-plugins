name: ML Kit Translate DEX Runtime Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlkit-translate-runtime-probe
  cancel-in-progress: true

jobs:
  resolve-compile-and-dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and D8
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Resolve AARs, inspect Android resources and build DEX
        run: |
          chmod +x tools/build_mlkit_translate_runtime.sh
          tools/build_mlkit_translate_runtime.sh plugins/translation/ml-translate

      - name: Validate signed runtime package contract
        run: python3 tools/validate_mlkit_translate_runtime.py plugins/translation/ml-translate

      - name: Read ML Kit plugin version
        id: plugin-version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("plugins/translation/ml-translate/plugin.json", encoding="utf-8"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and verify signed ML Kit plugin ZIP
        env:
          LINK_PLUGIN_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.LINK_PLUGIN_RUNTIME_SIGNING_PRIVATE_KEY }}
        run: |
          python3 tools/package_mlkit_translate_runtime.py plugins/translation/ml-translate "dist/ml-translate-${{ steps.plugin-version.outputs.version }}.zip"

      - name: Upload signed ML Kit plugin ZIP for integration testing
        uses: actions/upload-artifact@v4
        with:
          name: ml-translate-${{ steps.plugin-version.outputs.version }}-signed
          path: dist/ml-translate-${{ steps.plugin-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Report runtime payload size
        if: always()
        run: |
          du -ah plugins/translation/ml-translate/code plugins/translation/ml-translate/provenance 2>/dev/null || true

      - name: Upload ML Kit AAR audit and extracted resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlkit-translate-aar-audit
          path: |
            plugins/translation/ml-translate/provenance/**
            plugins/translation/ml-translate/lib/arm64-v8a/**
            plugins/translation/ml-translate/code/**
          if-no-files-found: warn
          retention-days: 3

  verify-pro-host-resource-extraction:
    needs: resolve-compile-and-dex
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify cross-repository read token is configured
        env:
          ANDROID_REPO_READ_TOKEN: ${{ secrets.LINK_ANDROID_REPO_READ_TOKEN }}
        run: |
          if [ -z "$ANDROID_REPO_READ_TOKEN" ]; then
            echo "::error::Add LINK_ANDROID_REPO_READ_TOKEN to the link-android-plugins repository Actions secrets. It must be a fine-grained PAT with Contents: Read access to Smart-Coder-Center/link-android."
            exit 1
          fi

      - name: Check out the Link Android integration branch
        uses: actions/checkout@v4
        with:
          repository: Smart-Coder-Center/link-android
          ref: main
          path: android-host
          token: ${{ secrets.LINK_ANDROID_REPO_READ_TOKEN }}

      - name: Download the AAR audit from the plugin build
        uses: actions/download-artifact@v4
        with:
          name: mlkit-translate-aar-audit
          path: plugin-audit

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Link compile SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        working-directory: android-host
        run: chmod +x ./gradlew

      - name: Run only the Pro ML Kit resource extraction task (no APK build)
        working-directory: android-host
        run: ./gradlew --no-daemon --stacktrace extractMlKitTranslateResources

      - name: Verify host-provided AndroidX runtime APIs
        working-directory: android-host
        run: |
          ./gradlew --no-daemon dependencyInsight --dependency androidx.fragment:fragment --configuration conversationsProStandardRuntimeClasspath | tee /tmp/link-fragment-deps.txt
          grep -Fq 'androidx.fragment:fragment' /tmp/link-fragment-deps.txt
          ./gradlew --no-daemon dependencyInsight --dependency androidx.lifecycle:lifecycle-common --configuration conversationsProStandardRuntimeClasspath | tee /tmp/link-lifecycle-deps.txt
          grep -Fq 'androidx.lifecycle:lifecycle-common' /tmp/link-lifecycle-deps.txt
          ./gradlew --no-daemon dependencyInsight --dependency com.google.mlkit:common --configuration conversationsProStandardRuntimeClasspath | tee /tmp/link-host-mlkit-common.txt
          if grep -Fq 'com.google.mlkit:common:' /tmp/link-host-mlkit-common.txt; then
            echo "ML Kit Common must remain plugin-local, not in the Pro host APK"
            exit 1
          fi

      - name: Verify extracted model, Translate resources and loader isolation
        working-directory: android-host
        run: |
          test -s build/generated/mlkit-resources/assets/tflite_langid.tflite.jpg
          test -s build/generated/mlkit-resources/res/raw/translate_models_metadata.json
          test -s build/generated/mlkit-resources/res/xml/rapid_response_client_defaults.xml
          python3 - <<'PY'
          from pathlib import Path
          source = Path("build.gradle").read_text(encoding="utf-8")
          loader = Path("src/main/java/eu/siacs/conversations/speech/plugins/NativeRuntimePackageVerifier.java").read_text(encoding="utf-8")
          rules = Path("proguard-rules.pro").read_text(encoding="utf-8")
          if "proImplementation 'androidx.core:core:1.16.0'" not in source:
              raise SystemExit("Pro host does not pin the AndroidX Core API used by the plugin DEX")
          if "proImplementation 'com.google.mlkit:common:" in source or "proImplementation 'com.google.android.gms:play-services-base:" in source:
              raise SystemExit("Redundant host ML Kit/GMS bootstrap dependencies defeat plugin class-loader isolation")
          for prefix in ("javax.inject.", "com.google.android.gms.", "com.google.mlkit.common.", "com.google.firebase."):
              if f'name.startsWith("{prefix}")' not in loader:
                  raise SystemExit(f"Plugin class loader does not isolate {prefix}")
          if "androidx.lifecycle.LifecycleObserver" not in rules or "androidx.fragment.app.DialogFragment" not in rules:
              raise SystemExit("R8 keep rules are missing parent-loaded AndroidX APIs referenced by the plugin DEX")
          required = "if (mode == 'conversations' && distribution == 'pro'"
          if required not in source or "features == 'standard' || features == 'lite'" not in source:
              raise SystemExit("ML Kit resources are not restricted to Conversations Pro Standard/Lite variants")
          import hashlib, json
          model = Path("build/generated/mlkit-resources/assets/tflite_langid.tflite.jpg")
          audit = json.loads(Path("plugin-audit/provenance/mlkit-aar-audit.json").read_text(encoding="utf-8"))
          assets = [item for item in audit.get("aar_assets", [])
                    if item.get("aar") == "com_google_mlkit__language-id__17.0.6.aar"
                    and item.get("path") == "assets/tflite_langid.tflite.jpg"]
          if len(assets) != 1:
              raise SystemExit("Plugin AAR audit must contain exactly one bundled Language ID model asset")
          digest = hashlib.sha256(model.read_bytes()).hexdigest()
          if digest != assets[0].get("sha256") or model.stat().st_size != assets[0].get("size_bytes"):
              raise SystemExit("Pro host APK asset is not byte-identical to the audited Language ID AAR model")
          print(f"Bundled Language ID model extracted and matched: {model.stat().st_size} bytes sha256={digest}")
          PY

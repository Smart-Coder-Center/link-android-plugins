name: Package and publish universal Link plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "plugins/**"

permissions:
  contents: write

concurrency:
  group: universal-plugin-publisher
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate data-only plugin archives
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          root = Path("plugins")
          dist = Path("dist/universal-plugins")
          dist.mkdir(parents=True, exist_ok=True)
          id_re = re.compile(r"^[a-z0-9]+([.-][a-z0-9]+)*$")
          kind_re = re.compile(r"^[a-z][a-z0-9-]{0,31}$")
          version_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$")
          link_re = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          forbidden = {".apk", ".dex", ".jar", ".so", ".sh", ".bat", ".cmd", ".ps1", ".py", ".class", ".js", ".mjs", ".cjs", ".rb", ".pl", ".php", ".vbs", ".command", ".exe", ".com"}
          max_archive = 10 * 1024**3
          max_expanded = 16 * 1024**3

          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          catalog_path = Path("manifest/plugins.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          if catalog.get("schema_version") != 1 or not isinstance(catalog.get("plugins"), list):
              raise SystemExit("Unsupported or invalid public catalog")
          by_id = {entry["id"]: entry for entry in catalog["plugins"]}
          pending = []

          manifests = sorted(root.glob("*/*/plugin.json")) if root.exists() else []
          for source_manifest in manifests:
              source_dir = source_manifest.parent
              metadata = json.loads(source_manifest.read_text(encoding="utf-8"))
              plugin_id = metadata.get("id", "")
              kind = metadata.get("kind", "")
              version = metadata.get("version", "")
              if not id_re.fullmatch(plugin_id) or not kind_re.fullmatch(kind):
                  raise SystemExit(f"Invalid id/kind in {source_manifest}")
              if source_dir.parent.name != kind or source_dir.name != plugin_id:
                  raise SystemExit(f"Source path must be plugins/<kind>/<id>: {source_dir}")
              if not version_re.fullmatch(version) or ".." in version:
                  raise SystemExit(f"Invalid immutable version for {plugin_id}")
              for field in ("name", "description", "language", "min_link_version"):
                  if not isinstance(metadata.get(field), str) or not metadata[field].strip():
                      raise SystemExit(f"Missing {field} in {source_manifest}")
              if not link_re.fullmatch(metadata["min_link_version"]):
                  raise SystemExit(f"Invalid min_link_version for {plugin_id}")
              if not isinstance(metadata.get("license"), dict) or not metadata["license"].get("name"):
                  print(f"::warning::License metadata is not specified for {plugin_id}; packaging continues.")
                  metadata["license"] = {"name": "Unspecified"}

              payload = []
              expanded = 0
              for item in sorted(source_dir.rglob("*")):
                  if item.is_symlink():
                      raise SystemExit(f"Symlinks are not allowed in plugin payloads: {item}")
                  if not item.is_file() or item == source_manifest:
                      continue
                  if item.suffix.lower() in forbidden:
                      raise SystemExit(f"Executable/code payload is not allowed: {item}")
                  relative = item.relative_to(source_dir).as_posix()
                  if relative.startswith("/") or ".." in Path(relative).parts:
                      raise SystemExit(f"Unsafe payload path: {relative}")
                  expanded += item.stat().st_size
                  payload.append((relative, item))
              if not payload:
                  raise SystemExit(f"Plugin {plugin_id} has no payload files")
              if expanded > max_expanded:
                  raise SystemExit(f"Expanded plugin payload exceeds 16 GiB: {plugin_id}")

              generated = dict(metadata)
              generated.pop("files", None)
              generated.pop("archive", None)
              generated["files"] = [{"path": rel, "sha256": sha(path)} for rel, path in payload]

              archive_name = f"{plugin_id}-{version}.zip"
              archive = dist / archive_name
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED, allowZip64=True) as z:
                  z.writestr("plugin.json", json.dumps(generated, ensure_ascii=False, indent=2) + "\n")
                  for relative, path in payload:
                      z.write(path, arcname=relative)
              archive_size = archive.stat().st_size
              if archive_size <= 0 or archive_size > max_archive:
                  raise SystemExit(f"Archive exceeds Link's 10 GiB limit: {plugin_id}")
              archive_hash = sha(archive)
              old = by_id.get(plugin_id)
              if old and old.get("version") == version:
                  old_archive = old.get("archive", {})
                  if old_archive.get("sha256", "").lower() != archive_hash:
                      raise SystemExit(f"{plugin_id} {version} is immutable; bump version before changing payload")
                  archive.unlink()
                  continue

              tag = f"plugin-{plugin_id}-{version}"
              entry = dict(metadata)
              entry["archive"] = {
                  "url": f"https://github.com/smart-center-code/link-android-plugins/releases/download/{tag}/{archive_name}",
                  "size_bytes": archive_size,
                  "sha256": archive_hash,
              }
              pending.append({"id": plugin_id, "version": version, "tag": tag,
                              "archive": str(archive), "entry": entry})

          if not pending:
              print("No new plugin versions to publish.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("pending=false\n")
              raise SystemExit(0)

          for item in pending:
              by_id[item["id"]] = item["entry"]
          catalog["plugins"] = sorted(by_id.values(), key=lambda item: (item["kind"], item["id"]))
          catalog["catalog_version"] = int(catalog.get("catalog_version", 0)) + 1
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(dist / "release-matrix.json", "w", encoding="utf-8") as out:
              json.dump(pending, out, ensure_ascii=False)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("pending=true\n")
          PY

      - name: Publish immutable GitHub Release assets
        if: steps.packages.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          packages = json.loads(Path("dist/universal-plugins/release-matrix.json").read_text())
          for item in packages:
              subprocess.run([
                  "gh", "release", "create", item["tag"], item["archive"],
                  "--title", f"Link plugin {item['id']} {item['version']}",
                  "--target", "main",
                  "--notes", f"Immutable data-only Link plugin package: {item['id']} {item['version']}."
              ], check=True)
          PY

      - name: Commit updated public catalog
        if: steps.packages.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest/plugins.json
          git commit -m "catalog: publish universal plugin package versions"
          git push origin HEAD:main

name: Package and publish universal Link plugins

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-plugin-publisher
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java for MediaPipe DEX packaging
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for D8
        uses: android-actions/setup-android@v3

      - name: Install pinned Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up pinned Gradle for Maven dependency resolution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Acquire pinned upstream plugin payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          root = Path("plugins")
          repo_re = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")
          revision_re = re.compile(r"^[0-9a-f]{40}$")
          hf_hosts = {
              "huggingface.co", "cdn-lfs.huggingface.co", "cas-bridge.xethub.hf.co",
              "transfer.xethub.hf.co", "hf.co",
          }
          github_hosts = {"github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"}
          max_total = 16 * 1024**3
          total = 0

          def safe_relative(value):
              return (isinstance(value, str) and value and not value.startswith("/")
                      and "\\" not in value
                      and all(part not in ("", ".", "..") for part in value.split("/")))

          def download(url, target, allowed_hosts, expected_size=None, expected_sha=None):
              global total
              request = urllib.request.Request(url, headers={"User-Agent": "Link-Plugin-Packager/1.0"})
              digest = hashlib.sha256()
              written = 0
              with urllib.request.urlopen(request, timeout=90) as response:
                  final = urllib.parse.urlparse(response.geturl())
                  if final.scheme != "https" or final.hostname not in allowed_hosts:
                      raise SystemExit(f"Untrusted upstream redirect host: {final.hostname}")
                  with target.open("xb") as output:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          written += len(chunk)
                          total += len(chunk)
                          if total > max_total or written > max_total:
                              raise SystemExit("Upstream plugin payloads exceed 16 GiB")
                          digest.update(chunk)
                          output.write(chunk)
              if written <= 0 or (expected_size is not None and written != expected_size):
                  raise SystemExit(f"Upstream size verification failed: {target.name}")
              actual_sha = digest.hexdigest()
              if expected_sha is not None and actual_sha != expected_sha:
                  raise SystemExit(f"Upstream SHA-256 verification failed: {target.name}")
              return written, actual_sha

          for manifest_path in sorted(root.glob("*/*/plugin.json")):
              metadata = json.loads(manifest_path.read_text(encoding="utf-8"))
              source = metadata.get("source")
              if source is None:
                  continue
              if not isinstance(source, dict):
                  raise SystemExit(f"Invalid source descriptor: {manifest_path}")
              base = manifest_path.parent.resolve()
              source_type = source.get("type")
              if source_type == "huggingface_files":
                  repo = source.get("repo", "")
                  revision = source.get("revision", "")
                  files = source.get("files")
                  if not repo_re.fullmatch(repo) or not revision_re.fullmatch(revision):
                      raise SystemExit(f"Source must pin a Hugging Face repo and full commit SHA: {manifest_path}")
                  if not isinstance(files, list) or not files or len(files) > 10000:
                      raise SystemExit(f"Invalid upstream file list: {manifest_path}")
                  seen = set()
                  for relative in files:
                      if not safe_relative(relative) or relative in seen:
                          raise SystemExit(f"Unsafe or duplicate upstream path: {relative}")
                      seen.add(relative)
                      target = (base / relative).resolve()
                      if base not in target.parents or target.exists():
                          raise SystemExit(f"Upstream target escapes source directory or already exists: {relative}")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      url = (f"https://huggingface.co/{repo}/resolve/{revision}/"
                             f"{urllib.parse.quote(relative, safe='/')}")
                      size, _ = download(url, target, hf_hosts)
                      print(f"Acquired {repo}@{revision}:{relative} ({size} bytes)")
              elif source_type == "mediapipe_magic_touch":
                  tasks_version = source.get("tasks_version")
                  model_url = source.get("model_url")
                  expected_model_url = "https://storage.googleapis.com/mediapipe-models/interactive_segmenter_v2/magic_touch/int8/1/interactive_segmentation.task"
                  if tasks_version != "1.1.1" or model_url != expected_model_url:
                      raise SystemExit(f"Magic Touch source must pin MediaPipe 1.1.1 and the reviewed model URL: {manifest_path}")
                  subprocess.run(["bash", "tools/build_magic_touch_runtime.sh", str(base)], check=True)
                  generated_path = base / ".link-runtime-generated.json"
                  if not generated_path.is_file():
                      raise SystemExit("Magic Touch runtime builder did not produce runtime metadata")
                  generated_runtime = json.loads(generated_path.read_text(encoding="utf-8"))
                  metadata.setdefault("runtime", {}).update(generated_runtime)
                  generated_path.unlink()
                  print(f"Built complete MediaPipe MagicTouch runtime for {manifest_path}")
              elif source_type == "github_release_zip":
                  url = source.get("url", "")
                  expected_size = source.get("size_bytes")
                  expected_sha = source.get("sha256", "")
                  prefix = "https://github.com/Smart-Coder-Center/link-android-plugins/releases/download/"
                  if (not isinstance(url, str) or not url.startswith(prefix)
                          or not isinstance(expected_size, int) or expected_size <= 0
                          or not re.fullmatch(r"[a-f0-9]{64}", expected_sha)):
                      raise SystemExit(f"GitHub seed ZIP must pin URL, size and SHA-256: {manifest_path}")
                  archive_path = base / ".migration-seed.zip"
                  size, _ = download(url, archive_path, github_hosts, expected_size, expected_sha)
                  seen = set()
                  with zipfile.ZipFile(archive_path) as archive:
                      infos = archive.infolist()
                      if not infos or len(infos) > 10000:
                          raise SystemExit("Migration seed ZIP has an invalid entry count")
                      expanded = sum(info.file_size for info in infos)
                      if expanded > max_total:
                          raise SystemExit("Migration seed ZIP expands beyond 16 GiB")
                      for info in infos:
                          relative = info.filename.rstrip("/") if info.is_dir() else info.filename
                          if relative == "plugin.json":
                              continue
                          if not safe_relative(relative) or relative in seen:
                              raise SystemExit(f"Unsafe or duplicate seed ZIP path: {relative}")
                          seen.add(relative)
                          mode = (info.external_attr >> 16) & 0o170000
                          if mode == 0o120000:
                              raise SystemExit(f"Symlink is not allowed in seed ZIP: {relative}")
                          target = (base / relative).resolve()
                          if base not in target.parents:
                              raise SystemExit(f"Seed ZIP path escapes source directory: {relative}")
                          if info.is_dir():
                              target.mkdir(parents=True, exist_ok=True)
                          else:
                              if target.exists():
                                  raise SystemExit(f"Seed ZIP would overwrite source file: {relative}")
                              target.parent.mkdir(parents=True, exist_ok=True)
                              with archive.open(info) as source_stream, target.open("xb") as output:
                                  while True:
                                      chunk = source_stream.read(1024 * 1024)
                                      if not chunk:
                                          break
                                      output.write(chunk)
                  archive_path.unlink()
                  if not seen:
                      raise SystemExit(f"Seed ZIP has no payload files: {manifest_path}")
                  print(f"Imported verified migration seed ZIP ({size} bytes): {manifest_path}")
              else:
                  raise SystemExit(f"Unsupported source type {source_type}: {manifest_path}")
          PY

      - name: Build and validate universal plugin archives
        id: packages
        env:
          LINK_PLUGIN_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.LINK_PLUGIN_RUNTIME_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          root = Path("plugins")
          dist = Path("dist/universal-plugins")
          dist.mkdir(parents=True, exist_ok=True)
          id_re = re.compile(r"^[a-z0-9]+([.-][a-z0-9]+)*$")
          kind_re = re.compile(r"^[a-z][a-z0-9-]{0,31}$")
          version_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$")
          link_re = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          dependency_types = {"data", "native_runtime", "play_feature"}
          forbidden = {".apk", ".dex", ".jar", ".so", ".sh", ".bat", ".cmd", ".ps1", ".py", ".class", ".js", ".mjs", ".cjs", ".rb", ".pl", ".php", ".vbs", ".command", ".exe", ".com"}
          runtime_data_suffixes = {".task", ".tflite", ".onnx", ".model", ".pb", ".bin", ".dat", ".txt", ".json", ".yaml", ".yml", ".md"}
          runtime_code_suffixes = {".jar", ".dex"}
          supported_abis = {"arm64-v8a", "armeabi-v7a", "x86", "x86_64"}
          public_key_path = Path("keys/native-runtime-ed25519-public.pem")
          max_archive = 10 * 1024**3
          max_expanded = 16 * 1024**3

          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          catalog_path = Path("manifest/plugins.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          if catalog.get("schema_version") != 1 or not isinstance(catalog.get("plugins"), list):
              raise SystemExit("Unsupported or invalid public catalog")
          by_id = {}
          for entry in catalog["plugins"]:
              plugin_id = entry.get("id") if isinstance(entry, dict) else None
              if not isinstance(plugin_id, str) or not id_re.fullmatch(plugin_id):
                  raise SystemExit("Public catalog contains an invalid plugin ID")
              if plugin_id in by_id:
                  raise SystemExit(f"Public catalog contains duplicate plugin ID: {plugin_id}")
              by_id[plugin_id] = entry
          pending = []

          manifests = sorted(root.glob("*/*/plugin.json")) if root.exists() else []
          for source_manifest in manifests:
              source_dir = source_manifest.parent
              metadata = json.loads(source_manifest.read_text(encoding="utf-8"))
              plugin_id = metadata.get("id", "")
              kind = metadata.get("kind", "")
              version = metadata.get("version", "")
              if not id_re.fullmatch(plugin_id) or not kind_re.fullmatch(kind):
                  raise SystemExit(f"Invalid id/kind in {source_manifest}")
              if source_dir.parent.name != kind or source_dir.name != plugin_id:
                  raise SystemExit(f"Source path must be plugins/<kind>/<id>: {source_dir}")
              if not version_re.fullmatch(version) or ".." in version:
                  raise SystemExit(f"Invalid immutable version for {plugin_id}")
              for field in ("name", "description", "language", "min_link_version"):
                  if not isinstance(metadata.get(field), str) or not metadata[field].strip():
                      raise SystemExit(f"Missing {field} in {source_manifest}")
              if not link_re.fullmatch(metadata["min_link_version"]):
                  raise SystemExit(f"Invalid min_link_version for {plugin_id}")
              package_type = metadata.get("package_type", "data")
              if package_type not in {"data", "native_runtime"}:
                  raise SystemExit(f"Unsupported package_type for {plugin_id}: {package_type}")
              if package_type == "native_runtime":
                  runtime = metadata.get("runtime", {})
                  abis = runtime.get("abis", []) if isinstance(runtime, dict) else []
                  load_order = runtime.get("load_order", []) if isinstance(runtime, dict) else []
                  if not isinstance(abis, list) or len(abis) != 1 or not set(abis).issubset(supported_abis):
                      raise SystemExit(f"Native runtime {plugin_id} must declare supported runtime.abis")
                  if not isinstance(load_order, list) or not load_order or len(set(load_order)) != len(load_order):
                      raise SystemExit(f"Native runtime {plugin_id} must declare a unique runtime.load_order")
              dependencies = metadata.get("dependencies", [])
              if not isinstance(dependencies, list) or len(dependencies) > 32:
                  raise SystemExit(f"Invalid dependency list for {plugin_id}")
              seen_dependencies = set()
              for dependency in dependencies:
                  if not isinstance(dependency, dict):
                      raise SystemExit(f"Invalid dependency entry for {plugin_id}")
                  dependency_id = dependency.get("id", "")
                  dependency_version = dependency.get("version", "")
                  dependency_type = dependency.get("package_type", "")
                  if (not id_re.fullmatch(dependency_id)
                          or not version_re.fullmatch(dependency_version)
                          or ".." in dependency_version
                          or dependency_type not in dependency_types
                          or dependency_id in seen_dependencies):
                      raise SystemExit(f"Invalid or duplicate dependency in {plugin_id}: {dependency_id}")
                  seen_dependencies.add(dependency_id)
              if not isinstance(metadata.get("license"), dict) or not metadata["license"].get("name"):
                  print(f"::warning::License metadata is not specified for {plugin_id}; packaging continues.")
                  metadata["license"] = {"name": "Unspecified"}

              payload = []
              expanded = 0
              native_library_count = 0
              for item in sorted(source_dir.rglob("*")):
                  if item.is_symlink():
                      raise SystemExit(f"Symlinks are not allowed in plugin payloads: {item}")
                  if not item.is_file() or item == source_manifest or item.name == ".link-runtime-generated.json":
                      continue
                  relative = item.relative_to(source_dir).as_posix()
                  suffix = item.suffix.lower()
                  if package_type == "data" and suffix in forbidden:
                      raise SystemExit(f"Executable/code payload is not allowed in data packages: {item}")
                  if package_type == "native_runtime":
                      if suffix == ".so":
                          parts = relative.split("/")
                          if len(parts) < 3 or parts[0] != "lib" or parts[1] not in abis:
                              raise SystemExit(f"Native library must be stored under lib/<declared-abi>/: {relative}")
                          native_library_count += 1
                      elif suffix == ".dex":
                          if not re.fullmatch(r"code/[A-Za-z0-9_./+-]+\.dex", relative):
                              raise SystemExit(f"Executable DEX payload has an unsafe path: {relative}")
                          with item.open("rb") as code_file:
                              if code_file.read(8)[:4] != b"dex\n":
                                  raise SystemExit(f"Invalid DEX payload: {relative}")
                      elif suffix == ".jar":
                          if relative.startswith("code/"):
                              if not re.fullmatch(r"code/[A-Za-z0-9_./+-]+\.jar", relative):
                                  raise SystemExit(f"Executable DEX-JAR payload has an unsafe path: {relative}")
                              with zipfile.ZipFile(item) as code_archive:
                                  if "classes.dex" not in code_archive.namelist():
                                      raise SystemExit(f"Runtime JAR must contain D8-produced classes.dex: {relative}")
                          elif relative.startswith("vendor-jars/"):
                              if not re.fullmatch(r"vendor-jars/[A-Za-z0-9_.+-]+\.jar", relative):
                                  raise SystemExit(f"Archived dependency JAR has an unsafe path: {relative}")
                              with zipfile.ZipFile(item) as source_archive:
                                  if source_archive.testzip() is not None or not source_archive.namelist():
                                      raise SystemExit(f"Archived dependency JAR is corrupt: {relative}")
                          else:
                              raise SystemExit(f"JAR payload must be executable under code/ or archived under vendor-jars/: {relative}")
                      elif suffix not in runtime_data_suffixes and item.name.upper() not in {"LICENSE", "NOTICE"}:
                          raise SystemExit(f"Unsupported native runtime payload file type: {relative}")
                  if relative.startswith("/") or "\\" in relative or any(part in ("", ".", "..") for part in Path(relative).parts):
                      raise SystemExit(f"Unsafe payload path: {relative}")
                  expanded += item.stat().st_size
                  payload.append((relative, item))
              if not payload:
                  raise SystemExit(f"Plugin {plugin_id} has no payload files")
              if package_type == "native_runtime":
                  library_paths = [rel for rel, _ in payload if rel.endswith(".so")]
                  code_paths = sorted(rel for rel, _ in payload if rel.startswith("code/") and Path(rel).suffix.lower() in runtime_code_suffixes)
                  declared_code = runtime.get("code_files", [])
                  if not isinstance(declared_code, list) or sorted(declared_code) != code_paths:
                      raise SystemExit(f"Native runtime {plugin_id} runtime.code_files must list every executable DEX/JAR under code/ exactly once")
                  if code_paths:
                      entry_class = runtime.get("entry_class", "")
                      if (not isinstance(entry_class, str)
                              or not re.fullmatch(r"[A-Za-z_$][A-Za-z0-9_$.]*", entry_class)
                              or runtime.get("code_api_version") != 1):
                          raise SystemExit(f"Native runtime {plugin_id} must declare a valid entry_class and code_api_version=1")
                  if native_library_count == 0:
                      raise SystemExit(f"Native runtime {plugin_id} must contain at least one ABI-scoped .so library")
                  if set(library_paths) != set(load_order) or len(library_paths) != len(load_order):
                      raise SystemExit(f"Native runtime {plugin_id} runtime.load_order must list every .so payload path exactly once")
              if len(payload) > 10000:
                  raise SystemExit(f"Plugin {plugin_id} exceeds Link's 10,000-file limit")
              if expanded > max_expanded:
                  raise SystemExit(f"Expanded plugin payload exceeds 16 GiB: {plugin_id}")

              generated = dict(metadata)
              generated.pop("files", None)
              generated.pop("archive", None)
              generated.pop("source", None)
              generated["files"] = [{"path": rel, "sha256": sha(path)} for rel, path in payload]
              signature_bytes = None
              if package_type == "native_runtime":
                  private_key = os.environ.get("LINK_PLUGIN_RUNTIME_SIGNING_PRIVATE_KEY", "").strip()
                  if not private_key or not public_key_path.is_file():
                      raise SystemExit("Native runtime publishing requires the LINK_PLUGIN_RUNTIME_SIGNING_PRIVATE_KEY secret and keys/native-runtime-ed25519-public.pem pinned public key.")
                  manifest_bytes = (json.dumps(generated, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
                  with tempfile.TemporaryDirectory(prefix="link-runtime-sign-") as temp_dir:
                      key_file = Path(temp_dir) / "private.pem"
                      derived_public = Path(temp_dir) / "derived-public.pem"
                      manifest_file = Path(temp_dir) / "plugin.json"
                      signature_file = Path(temp_dir) / "plugin.json.sig"
                      key_file.write_text(private_key + "\n", encoding="utf-8")
                      manifest_file.write_bytes(manifest_bytes)
                      subprocess.run(["openssl", "pkey", "-in", str(key_file), "-pubout", "-out", str(derived_public)], check=True, capture_output=True)
                      if derived_public.read_bytes().strip() != public_key_path.read_bytes().strip():
                          raise SystemExit("Runtime signing private key does not match the repository-pinned public key.")
                      subprocess.run(["openssl", "pkeyutl", "-sign", "-rawin", "-inkey", str(key_file), "-in", str(manifest_file), "-out", str(signature_file)], check=True, capture_output=True)
                      signature_bytes = base64.b64encode(signature_file.read_bytes())

              archive_name = f"{plugin_id}-{version}.zip"
              archive = dist / archive_name
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
                  z.writestr("plugin.json", json.dumps(generated, ensure_ascii=False, indent=2) + "\n")
                  if signature_bytes is not None:
                      z.writestr("plugin.json.sig", signature_bytes)
                  for relative, path in payload:
                      z.write(path, arcname=relative)
              archive_size = archive.stat().st_size
              if archive_size <= 0 or archive_size > max_archive:
                  raise SystemExit(f"Archive exceeds Link's 10 GiB limit: {plugin_id}")
              archive_hash = sha(archive)
              old = by_id.get(plugin_id)
              if old and old.get("version") == version:
                  old_archive = old.get("archive", {})
                  if old_archive.get("sha256", "").lower() != archive_hash:
                      raise SystemExit(f"{plugin_id} {version} is immutable; bump version before changing payload")
                  archive.unlink()
                  continue

              tag = f"plugin-{plugin_id}-{version}"
              entry = dict(metadata)
              entry.pop("source", None)
              entry["archive"] = {
                  "url": f"https://github.com/Smart-Coder-Center/link-android-plugins/releases/download/{tag}/{archive_name}",
                  "size_bytes": archive_size,
                  "sha256": archive_hash,
              }
              pending.append({"id": plugin_id, "version": version, "tag": tag,
                              "archive": str(archive), "entry": entry})

          if not pending:
              print("No new plugin versions to publish.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("pending=false\n")
              raise SystemExit(0)

          for item in pending:
              by_id[item["id"]] = item["entry"]
          catalog["plugins"] = sorted(by_id.values(), key=lambda item: (item["kind"], item["id"]))
          catalog["catalog_version"] = int(catalog.get("catalog_version", 0)) + 1
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(dist / "release-matrix.json", "w", encoding="utf-8") as out:
              json.dump(pending, out, ensure_ascii=False)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("pending=true\n")
          PY

      - name: Publish immutable GitHub Release assets
        if: steps.packages.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          packages = json.loads(Path("dist/universal-plugins/release-matrix.json").read_text())

          def run(args, check=True):
              return subprocess.run(args, check=check, text=True, capture_output=True)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for item in packages:
              archive = Path(item["archive"])
              tag = item["tag"]
              # A previous run may have created the immutable Release but failed before
              # updating the catalog. Reuse only an asset whose exact bytes match.
              existing = run(["gh", "release", "view", tag, "--json", "assets"], check=False)
              if existing.returncode == 0:
                  assets = json.loads(existing.stdout).get("assets", [])
                  matching = [asset for asset in assets if asset.get("name") == archive.name]
                  if len(matching) > 1:
                      raise SystemExit(f"Release contains duplicate asset names: {tag}/{archive.name}")
                  if matching:
                      with tempfile.TemporaryDirectory(prefix="link-plugin-release-") as directory:
                          run(["gh", "release", "download", tag, "--pattern", archive.name,
                               "--dir", directory])
                          downloaded = Path(directory) / archive.name
                          if (not downloaded.is_file()
                                  or downloaded.stat().st_size != archive.stat().st_size
                                  or sha256(downloaded) != sha256(archive)):
                              raise SystemExit(f"Immutable release asset mismatch: {tag}/{archive.name}")
                      print(f"Verified existing immutable release asset: {tag}/{archive.name}")
                  else:
                      run(["gh", "release", "upload", tag, str(archive)])
                      print(f"Uploaded missing asset to existing release: {tag}/{archive.name}")
              else:
                  error_text = (existing.stderr or "").lower()
                  if "not found" not in error_text and "404" not in error_text:
                      raise SystemExit(f"Could not inspect existing release {tag}: {existing.stderr}")
                  run([
                      "gh", "release", "create", tag, str(archive),
                      "--title", f"Link plugin {item['id']} {item['version']}",
                      "--target", "main",
                      "--notes", f"Immutable signed Link plugin package: {item['id']} {item['version']}."
                  ])
          PY

      - name: Commit updated public catalog
        if: steps.packages.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest/plugins.json
          git commit -m "catalog: publish universal plugin package versions"
          git push origin HEAD:main

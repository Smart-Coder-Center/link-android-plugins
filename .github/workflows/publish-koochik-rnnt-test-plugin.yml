name: Publish Persian Koochik RNNT test plugin

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Immutable test package version
        required: true
        default: "1.0.0-test.1"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-koochik-rnnt-test-plugin.yml"

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and pin reviewed upstream revision
        id: model
        shell: bash
        run: |
          set -euo pipefail
          REPO="https://huggingface.co/Reza2kn/Shenava-Koochik-v1.5-RNNT-sherpa-onnx"
          REVISION="$(git ls-remote "$REPO" refs/heads/main | awk '{print $1}')"
          if [[ ! "$REVISION" =~ ^c46e9af ]]; then
            echo "::error::Upstream model revision changed; review it before publishing."
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Reviewed upstream revision: $REVISION"

      - name: Download INT8 model files and license
        shell: bash
        env:
          MODEL_REVISION: ${{ steps.model.outputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p dist/koochik
          BASE="https://huggingface.co/Reza2kn/Shenava-Koochik-v1.5-RNNT-sherpa-onnx/resolve/$MODEL_REVISION"
          for FILE in encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt LICENSE; do
            curl -fL --retry 3 "$BASE/$FILE" -o "dist/koochik/$FILE"
            test -s "dist/koochik/$FILE"
          done

      - name: Build verified data-only plugin
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || '1.0.0-test.1' }}
          MODEL_REVISION: ${{ steps.model.outputs.revision }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          revision = os.environ["MODEL_REVISION"]
          if not version or len(version) > 64:
              raise SystemExit("Invalid package version")
          source = Path("dist/koochik")
          package = Path("dist/package")
          package.mkdir(parents=True, exist_ok=True)

          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          files = ["encoder.int8.onnx", "decoder.int8.onnx", "joiner.int8.onnx", "tokens.txt", "LICENSE"]
          checksums = []
          for name in files:
              src = source / name
              if not src.is_file() or src.stat().st_size == 0:
                  raise SystemExit(f"Missing model file: {name}")
              dst = package / name
              dst.write_bytes(src.read_bytes())
              checksums.append({"path": name, "sha256": sha(dst)})

          inner = {
              "id": "asr.koochik-rnnt.fa",
              "version": version,
              "kind": "asr",
              "language": "fa",
              "upstream_revision": revision,
              "files": checksums,
          }
          (package / "plugin.json").write_text(
              json.dumps(inner, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          archive = Path(f"dist/koochik-rnnt-fa-{version}.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED) as z:
              for item in sorted(package.iterdir()):
                  z.write(item, arcname=item.name)
          expanded = sum(p.stat().st_size for p in package.iterdir() if p.is_file())
          if archive.stat().st_size > 400 * 1024 * 1024 or expanded > 500 * 1024 * 1024:
              raise SystemExit("Koochik package exceeds Link's plugin limits")
          entry = {
              "id": "asr.koochik-rnnt.fa",
              "name": "Koochik RNNT فارسی (آزمایشی)",
              "description": "مدل تخصصی فارسی FastConformer برای تبدیل آفلاین گفتار به نوشتار؛ نسخه آزمایشی",
              "kind": "asr",
              "language": "fa",
              "version": version,
              "min_link_version": "2.21.0",
              "archive": {
                  "url": f"https://github.com/Smart-Coder-Center/link-android-plugins/releases/download/koochik-rnnt-test-{version}/{archive.name}",
                  "size_bytes": archive.stat().st_size,
                  "sha256": sha(archive),
              },
              "license": {
                  "name": "Apache-2.0",
                  "url": "https://www.apache.org/licenses/LICENSE-2.0",
                  "attribution": f"Shenava Koochik v1.5 RNNT sherpa-onnx model; upstream revision {revision}",
              },
              "release_notes": f"Experimental offline Persian RNNT model. Sherpa-ONNX nemo_transducer. Upstream revision {revision}; author-reported Golden-6669 WER 9.50% / CER 2.60%. Not yet independently benchmarked on Link devices.",
          }
          manifest_path = Path("manifest/plugins.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["plugins"] = [p for p in manifest["plugins"] if p["id"] != entry["id"]]
          manifest["plugins"].append(entry)
          manifest["catalog_version"] += 1
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish immutable test release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.package_version || '1.0.0-test.1' }}
        run: |
          set -euo pipefail
          TAG="koochik-rnnt-test-$PACKAGE_VERSION"
          gh release create "$TAG" "dist/koochik-rnnt-fa-$PACKAGE_VERSION.zip" \
            --title "Link Persian Koochik RNNT test model $PACKAGE_VERSION" \
            --target main \
            --notes "Experimental data-only Persian ASR plugin for Link. Model files are INT8 and use the bundled Sherpa-ONNX runtime with model_type=nemo_transducer. Model license: Apache-2.0. The published benchmark is upstream-reported and not a Link-device measurement."

      - name: Commit catalog metadata
        env:
          PACKAGE_VERSION: ${{ inputs.package_version || '1.0.0-test.1' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest/plugins.json
          git commit -m "catalog: publish Persian Koochik RNNT test plugin $PACKAGE_VERSION"
          git push origin HEAD:main

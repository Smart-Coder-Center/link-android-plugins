name: Publish Persian Whisper test plugins

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test package version"
        required: true
        default: "1.0.0-test.1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-whisper-test-plugins.yml"

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Base and Small data-only packages
        env:
          PACKAGE_VERSION: ${{ inputs.version || '1.0.0-test.1' }}
        run: python scripts/package_whisper_test_plugins.py --version "$PACKAGE_VERSION"

      - name: Check generated package sizes
        run: |
          ls -lh dist/*.zip
          python - <<'PY'
          from pathlib import Path
          for path in Path("dist").glob("*.zip"):
              assert path.stat().st_size <= 400 * 1024 * 1024, path
          PY

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version || '1.0.0-test.1' }}
        run: |
          TAG="whisper-test-${PACKAGE_VERSION}"
          gh release create "$TAG" dist/*.zip --title "Link Persian Whisper test models ${PACKAGE_VERSION}" --target main --notes "Experimental offline Persian ASR test packages for Link. Includes multilingual Whisper Base and Small INT8 ONNX exports. Compare both on the same Android device and audio set. Model weights derive from OpenAI Whisper (MIT); converted ONNX artifacts are from the pinned sherpa-onnx model repositories."

      - name: Commit generated catalog metadata
        env:
          PACKAGE_VERSION: ${{ inputs.version || '1.0.0-test.1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest/plugins.json
          git commit -m "catalog: publish Persian Whisper test plugins ${PACKAGE_VERSION}"
          git push origin HEAD:main

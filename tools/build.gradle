repositories {
    google()
    // Maven Central's primary endpoint can temporarily return HTTP 429 on hosted runners.
    // Use Google's read-only mirror first, then retain the canonical endpoint as fallback.
    maven {
        name = 'GoogleMavenCentralMirror'
        url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
    }
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

configurations {
    mediaPipeRuntime
}

dependencies {
    mediaPipeRuntime 'com.google.mediapipe:tasks-vision:1.1.1'
}

tasks.register('copyMediaPipeRuntimeArtifacts') {
    doLast {
        def destination = file(project.findProperty('runtimeOutputDir') ?: 'build/mediapipe-artifacts')
        destination.mkdirs()
        configurations.mediaPipeRuntime.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def extension = artifact.extension ?: artifact.type ?: 'jar'
            def safeName = "${artifact.moduleVersion.id.group.replace('.', '_')}__${artifact.name}__${artifact.moduleVersion.id.version}.${extension}"
            copy {
                from artifact.file
                into destination
                rename { safeName }
            }
            println("MEDIAPIPE_ARTIFACT ${artifact.moduleVersion.id} ${extension} ${artifact.file.length()}")
        }
    }
}


configurations {
    mlKitTranslateRuntime
}

dependencies {
    // Same offline Persian/English OCR engine used by Document Editor; packaged only in this plugin.
    mlKitTranslateRuntime 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    mlKitTranslateRuntime 'com.google.mlkit:translate:17.0.2'
    // Bundled Language ID implementation; its model resources must be merged into Pro host APK resources.
    mlKitTranslateRuntime 'com.google.mlkit:language-id:17.0.6'
    // Pin the ML Kit Common version selected by the bundled Language ID 17.0.6 AAR.
    // Keep it plugin-local; it must not reuse Link's host singleton.
    mlKitTranslateRuntime 'com.google.mlkit:common:18.11.0'
    // Pin the GMS runtime used by the isolated ML Kit Common registry.
    mlKitTranslateRuntime 'com.google.android.gms:play-services-base:18.10.0'
    mlKitTranslateRuntime 'com.google.android.gms:play-services-basement:18.10.0'
    mlKitTranslateRuntime 'com.google.android.gms:play-services-tasks:18.4.1'
    // GMS ClientSettings uses ArraySet; bundle it in the same isolated plugin DEX,
    // rather than resolving a potentially R8-modified host copy at runtime.
    mlKitTranslateRuntime 'androidx.collection:collection:1.5.0'
    // ML Kit references Kotlin collection marker interfaces; keep stdlib inside plugin DEX.
    mlKitTranslateRuntime 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    // ML Kit's internal translate transport still calls the OkHttp 3 static MediaType.parse API.
    // Link's host APK uses OkHttp 5, so ship this compatible transport inside the isolated plugin DEX.
    mlKitTranslateRuntime 'com.squareup.okhttp3:okhttp:3.12.13'
    mlKitTranslateRuntime 'com.squareup.okio:okio:1.15.0'
}

tasks.register('copyMlKitTranslateRuntimeArtifacts') {
    doLast {
        def destination = file(project.findProperty('mlKitOutputDir') ?: 'build/mlkit-translate-artifacts')
        destination.mkdirs()
        configurations.mlKitTranslateRuntime.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def extension = artifact.extension ?: artifact.type ?: 'jar'
            def safeName = "${artifact.moduleVersion.id.group.replace('.', '_')}__${artifact.name}__${artifact.moduleVersion.id.version}.${extension}"
            copy {
                from artifact.file
                into destination
                rename { safeName }
            }
            println("MLKIT_TRANSLATE_ARTIFACT ${artifact.moduleVersion.id} ${extension} ${artifact.file.length()}")
        }
    }
}


configurations {
    documentEditorRuntime
}

dependencies {
    // Persian/English offline OCR: Tesseract 5.5.1 with ARM64 JNI libraries.
    documentEditorRuntime 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    // Document edge detection/crop/PDF and QR/1D barcode UI are delivered by Google Play services.
    documentEditorRuntime 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    documentEditorRuntime 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // ML Kit's init provider lives in Link's host process/class loader, while this runtime
    // has an isolated DEX loader. Bundle the matching common runtime and initialize its
    // MlKitContext explicitly from DocumentEditorPlugin before using either scanner.
    documentEditorRuntime 'com.google.mlkit:common:18.11.0'
    // Keep the GMS and AndroidX dependency graph isolated and version-pinned in the plugin DEX.
    documentEditorRuntime 'com.google.android.gms:play-services-base:18.10.0'
    documentEditorRuntime 'com.google.android.gms:play-services-basement:18.10.0'
    documentEditorRuntime 'com.google.android.gms:play-services-tasks:18.4.1'
    documentEditorRuntime 'androidx.collection:collection:1.5.0'
    documentEditorRuntime 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}

tasks.register('copyDocumentEditorRuntimeArtifacts') {
    doLast {
        def destination = file(project.findProperty('documentEditorOutputDir') ?: 'build/document-editor-artifacts')
        destination.mkdirs()
        configurations.documentEditorRuntime.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def extension = artifact.extension ?: artifact.type ?: 'jar'
            def safeName = "${artifact.moduleVersion.id.group.replace('.', '_')}__${artifact.name}__${artifact.moduleVersion.id.version}.${extension}"
            copy {
                from artifact.file
                into destination
                rename { safeName }
            }
            println("DOCUMENT_EDITOR_ARTIFACT ${artifact.moduleVersion.id} ${extension} ${artifact.file.length()}")
        }
    }
}
